<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 440" fill="none">
  <defs>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e1112" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0e1112" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bundleFront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <ellipse cx="180" cy="390" rx="108" ry="15" fill="url(#shadow)"/>
  <!-- Lid & box isometric -->
  <polygon points="74,142 180,98 286,142 180,186" fill="#27364d" stroke="#0e1112" stroke-width="2.5"/>
  <polygon points="104,142 180,111 256,142 180,173" fill="url(#copper)" opacity="0.9"/>
  <!-- Left panel -->
  <polygon points="74,142 180,186 180,356 74,312" fill="url(#bundleFront)" stroke="#0e1112" stroke-width="2.5"/>
  <!-- Right panel -->
  <polygon points="180,186 286,142 286,312 180,356" fill="#171b1c" stroke="#0e1112" stroke-width="2.5"/>
  <polygon points="198,200 268,170 268,292 198,322" fill="#23292b" stroke="#fb923c" stroke-width="1.5"/>
  <!-- Bundle emblem on left panel -->
  <polygon points="94,180 162,208 162,298 94,270" fill="#0e1112" stroke="#facc15" stroke-width="2"/>
  <circle cx="128" cy="238" r="20" fill="url(#copper)"/>
  <text x="128" y="244" text-anchor="middle" fill="#0e1112" font-family="Arial Narrow, sans-serif" font-weight="800" font-size="14">8x</text>
  <!-- Top band -->
  <polygon points="74,142 180,186 286,142 286,166 180,210 74,166" fill="#d7261e" stroke="#0e1112" stroke-width="2"/>
  <text x="232" y="254" text-anchor="middle" fill="#facc15" font-family="Arial Narrow, sans-serif" font-weight="800" font-size="14" transform="skewY(-22)">BUNDLE</text>
</svg>
