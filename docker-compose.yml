name: sobrecambio

# Uso:
#   docker compose --env-file .env.local up -d --build
#   docker compose --env-file .env.local --profile seed run --rm seed
#
# Requiere .env.local en la raíz (DB_PASSWORD, JWT_SECRET, ...).
# La base se publica en 5433 para no chocar con un PostgreSQL local en 5432.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-tcg_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD en .env.local y usa --env-file .env.local}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth-service:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        SERVICE: auth-service
    env_file:
      - .env.local
    environment:
      SERVER_PORT: "8082"
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy

  catalogo-service:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        SERVICE: catalogo-service
    env_file:
      - .env.local
    environment:
      SERVER_PORT: "8081"
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      auth-service:
        condition: service_healthy

  trade-service:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        SERVICE: trade-service
    env_file:
      - .env.local
    environment:
      SERVER_PORT: "8083"
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      auth-service:
        condition: service_healthy

  chat-service:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        SERVICE: chat-service
    env_file:
      - .env.local
    environment:
      SERVER_PORT: "8084"
      DB_HOST: db
      DB_PORT: "5432"
      TRADE_SERVICE_URL: http://trade-service:8083
    depends_on:
      trade-service:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        SERVICE: api-gateway
    env_file:
      - .env.local
    environment:
      SERVER_PORT: "8080"
      AUTH_SERVICE_URL: http://auth-service:8082
      CATALOG_SERVICE_URL: http://catalogo-service:8081
      TRADE_SERVICE_URL: http://trade-service:8083
      CHAT_SERVICE_URL: http://chat-service:8084
      CHAT_SERVICE_WS_URL: ws://chat-service:8084
      FRONTEND_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_healthy
      catalogo-service:
        condition: service_healthy
      trade-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      api-gateway:
        condition: service_healthy

  # Datos de demostración. No corre con `up`: se invoca explícitamente.
  # Borra y recrea catálogo, publicaciones, trueques y usuarios sembrados.
  seed:
    image: postgres:16-alpine
    profiles: ["seed"]
    env_file:
      - .env.local
    environment:
      PGHOST: db
      PGDATABASE: ${DB_NAME:-tcg_db}
      PGUSER: ${DB_USERNAME:-postgres}
      PGPASSWORD: ${DB_PASSWORD:?define DB_PASSWORD en .env.local y usa --env-file .env.local}
    volumes:
      - ./db:/seed:ro
    depends_on:
      auth-service:
        condition: service_healthy
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/seed/seed.sql"]
    restart: "no"

volumes:
  db_data:
