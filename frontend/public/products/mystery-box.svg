<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 440" fill="none">
  <defs>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e1112" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#0e1112" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d7261e"/>
    </linearGradient>
  </defs>
  <ellipse cx="180" cy="390" rx="108" ry="15" fill="url(#shadow)"/>
  <!-- Cube top -->
  <polygon points="78,144 180,96 282,144 180,192" fill="#1f2426" stroke="#0e1112" stroke-width="2.5"/>
  <!-- Seal cross ribbon -->
  <polygon points="154,108 206,108 206,180 154,180" fill="url(#gold)" opacity="0.2"/>
  <polygon points="104,132 256,156 232,168 80,144" fill="#d7261e"/>
  <polygon points="148,111 212,177 188,188 124,122" fill="#d7261e"/>
  <!-- Left face -->
  <polygon points="78,144 180,192 180,356 78,308" fill="#0e1112" stroke="#0e1112" stroke-width="2.5"/>
  <polygon points="94,172 164,205 164,328 94,295" fill="#171b1c" stroke="url(#gold)" stroke-width="2"/>
  <text x="129" y="272" text-anchor="middle" fill="url(#gold)" font-family="Arial Narrow, sans-serif" font-weight="800" font-size="64">?</text>
  <!-- Right face -->
  <polygon points="180,192 282,144 282,308 180,356" fill="#171b1c" stroke="#0e1112" stroke-width="2.5"/>
  <polygon points="196,205 266,172 266,295 196,328" fill="#0e1112" stroke="#d7261e" stroke-width="2"/>
  <text x="231" y="272" text-anchor="middle" fill="#d7261e" font-family="Arial Narrow, sans-serif" font-weight="800" font-size="64">?</text>
  <!-- Wax stamp -->
  <circle cx="180" cy="192" r="22" fill="#d7261e" stroke="#fde047" stroke-width="2.5"/>
  <text x="180" y="198" text-anchor="middle" fill="#ffffff" font-family="Arial Narrow, sans-serif" font-weight="800" font-size="14">VIP</text>
</svg>
