server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: api-gateway
  web:
    error:
      # Boot 4 movió esta propiedad de server.error a spring.web.error.
      include-message: always
app:
  jwt:
    secret: ${JWT_SECRET:tcg-local-development-secret-change-me}
  services:
    auth-url: ${AUTH_SERVICE_URL:http://localhost:8082}
    catalog-url: ${CATALOG_SERVICE_URL:http://localhost:8081}
    trade-url: ${TRADE_SERVICE_URL:http://localhost:8083}
    chat-url: ${CHAT_SERVICE_URL:http://localhost:8084}
    chat-ws-url: ${CHAT_SERVICE_WS_URL:ws://localhost:8084}
  cors:
    allowed-origins: ${FRONTEND_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:5173}
