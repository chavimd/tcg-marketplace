server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: auth-service
  web:
    error:
      # Boot 4 movió esta propiedad de server.error a spring.web.error.
      include-message: always
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tcg_db}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # El esquema lo controla Flyway. Hibernate solo valida que las entidades coincidan.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    # La base ya existente se marca como version 1 y solo se aplican las migraciones nuevas.
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    # Sobrescribir con JWT_SECRET fuera del entorno local.
    secret: ${JWT_SECRET:tcg-local-development-secret-change-me}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
